# Workpulse — local Docker orchestration
#
# Default (no profile): starts Postgres + Adminer + MinIO. Run api/web locally via `pnpm dev`.
#   $ docker compose up -d
#
# Full stack (build images, run everything in containers):
#   $ docker compose --profile full up --build
#
# Services available (default host ports; override via env, see below):
#   - Postgres:  localhost:${POSTGRES_HOST_PORT:-5432}
#   - Adminer:   http://localhost:${ADMINER_HOST_PORT:-8080}      (DB inspector)
#   - MinIO S3:  http://localhost:${MINIO_S3_HOST_PORT:-9000}     (attachments store — S3-compatible)
#   - MinIO UI:  http://localhost:${MINIO_CONSOLE_HOST_PORT:-9001} (login: workpulse / workpulse-secret)
#   - API:       http://localhost:${API_HOST_PORT:-4000}          (full-profile only)
#   - Web:       http://localhost:${WEB_HOST_PORT:-3000}          (full-profile only)
#
# ---- Port parameterization ---------------------------------------------------
# All HOST-side port mappings are env-driven so this stack can co-exist with
# other Docker projects that use the same defaults (e.g. another Next.js app on
# :3000, another Postgres on :5432). Container-INTERNAL ports never change,
# which keeps container-to-container URLs (postgres:5432, minio:9000, api:4000,
# web:3000) stable regardless of what the host maps them to.
#
# Override at invocation time or via `.env`:
#   POSTGRES_HOST_PORT=5433  ADMINER_HOST_PORT=8081  \
#   MINIO_S3_HOST_PORT=9010  MINIO_CONSOLE_HOST_PORT=9011  \
#   API_HOST_PORT=4001       WEB_HOST_PORT=3001            \
#   docker compose --profile full up -d
#
# Or add these to `.env` once and every subsequent `docker compose` call picks
# them up automatically.
# -----------------------------------------------------------------------------
#
# Note: this compose file is for LOCAL development and CI verification. Production
# deployments should use `docker-compose.prod.yml` (Caddy + TLS + backup) or a
# hardened orchestrator (Kubernetes, ECS, etc.).

name: workpulse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
      POSTGRES_DB: workpulse
      # Faster boot for dev; do NOT use in production
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      postgres:
        condition: service_healthy

  # MinIO — S3-compatible object storage for local dev (attachments, reports).
  # Console UI on :9001, S3 API on :9000. Credentials MUST match .env S3_* vars.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_S3_HOST_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"  # Web console
    environment:
      MINIO_ROOT_USER: workpulse
      MINIO_ROOT_PASSWORD: workpulse-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot bucket bootstrapper. Creates the `workpulse` bucket + sets it private.
  # Idempotent — safe to re-run on every `docker compose up`.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 workpulse workpulse-secret &&
      mc mb --ignore-existing local/workpulse &&
      mc anonymous set none local/workpulse &&
      echo 'MinIO bucket ready: workpulse'
      "
    restart: "no"

  # ---------------------------------------------------------------
  # Full stack — opt-in via `--profile full`
  # ---------------------------------------------------------------
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: workpulse/api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides from `.env` — `.env` DATABASE_URL/S3_ENDPOINT point at
      # `localhost` (correct for host-side `pnpm dev`), but inside the compose
      # network we need the container hostnames.
      DATABASE_URL: postgresql://workpulse:workpulse@postgres:5432/workpulse?schema=public
      S3_ENDPOINT: http://minio:9000
      # CORS must allow the browser origin, which the user sees via the HOST
      # port. If they remap ${WEB_HOST_PORT}, CORS_ORIGIN follows.
      CORS_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost:4000/api/v1/health >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        # NEXT_PUBLIC_* is inlined at BUILD time by Next.js, so we must pass
        # the host-visible API URL as a build-arg (not runtime env). If the
        # user changes ${API_HOST_PORT}, a `--build` is required to re-inline.
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    image: workpulse/web:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Kept for parity with the build arg. Same caveat: NEXT_PUBLIC_*
      # runtime values only take effect for edge/middleware code paths that
      # read them from process.env directly.
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
