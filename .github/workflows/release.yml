name: Release

# Fires on semver tag pushes (`v1.2.3`, `v1.2.3-rc.1`, …) — the same
# tag scheme referenced by `scripts/deploy.sh` (`IMAGE_TAG`). PRs and
# main-branch pushes never touch this workflow.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to publish (must already exist on origin).'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege first. Individual jobs escalate only what they need
# (`packages: write` for GHCR push, `id-token: write` for provenance,
# `attestations: write` for SBOM upload).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  # ---------------------------------------------------------------------------
  # Sanity — verify the tag matches package.json's `version` field so we don't
  # publish `v1.2.3` from code that says `1.1.9`. Deploys read from
  # `IMAGE_TAG` env, so this alignment matters.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify tag ↔ package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        name: Parse tag and cross-check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF_TAG="${{ inputs.tag }}"
          else
            REF_TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$REF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$REF_TAG' does not match semver v-prefixed format." >&2
            exit 1
          fi
          VERSION="${REF_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag $REF_TAG says version=$VERSION but package.json is $PKG_VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION"

  # ---------------------------------------------------------------------------
  # Build + push each image with buildx + gha cache. Runs in parallel per
  # component; each job produces its own digest so the SBOM stage can attest
  # against the exact bytes pushed.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.name }}
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/${{ github.repository }}/api
            dockerfile: apps/api/Dockerfile
            build_args: ''
          - name: web
            image: ghcr.io/${{ github.repository }}/web
            dockerfile: apps/web/Dockerfile
            # `NEXT_PUBLIC_API_URL` is inlined at build time. Deploy targets
            # override it via the tenant's edge domain, so the build-time
            # value is only a fallback.
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.verify-tag.outputs.version }}
            type=raw,value=v${{ needs.verify-tag.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.verify-tag.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=workpulse-${{ matrix.name }}
            org.opencontainers.image.description=Workpulse ${{ matrix.name }} — enterprise attendance
            org.opencontainers.image.version=${{ needs.verify-tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Multi-arch left off intentionally — the target VPS is amd64.
          # Add `linux/arm64` here once we take on Graviton / Ampere hosts.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: mode=max
          sbom: true

      # SLSA attestation via `actions/attest-build-provenance` is a paid
      # feature on user-owned private repositories (returns 403 with
      # "Feature not available for user-owned private repositories"). We
      # still ship supply-chain metadata via buildx `provenance: mode=max`
      # + `sbom: true` on the build step above (embedded in the OCI
      # manifest). The dedicated attestation step is best-effort until
      # the repo moves to a GitHub organisation.
      - name: Attest provenance (SLSA)
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Print digest
        run: |
          echo "::notice title=${{ matrix.name }} digest::${{ steps.build.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Post-publish sanity — pull the freshly-pushed images and run the same
  # smoke test the deploy script would run. Catches "we pushed a broken
  # image" before ops flips the tag on production.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke boot ${{ matrix.name }}
    needs: [verify-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/${{ github.repository }}/api
            port: 4000
            health_path: /api/v1/health
          - name: web
            image: ghcr.io/${{ github.repository }}/web
            port: 3000
            # Next standalone serves 200 on `/` once the server is up.
            health_path: /
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & smoke-boot
        env:
          IMG: ${{ matrix.image }}:${{ needs.verify-tag.outputs.version }}
          PORT: ${{ matrix.port }}
          HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          set -euo pipefail
          docker pull "$IMG"
          # The API image runs `prisma migrate deploy` at boot which will
          # fail without a real DB — smoke only launches the WEB image
          # here; the API smoke stays as a manifest inspection.
          if [[ "${{ matrix.name }}" == "api" ]]; then
            docker inspect "$IMG" >/dev/null
            echo "::notice::API image manifest verified. Deep smoke deferred to deploy target."
            exit 0
          fi
          docker run -d --name smoke -p "$PORT:$PORT" "$IMG"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT$HEALTH_PATH" >/dev/null; then
              echo "smoke passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::smoke health probe never returned 200" >&2
          docker logs smoke || true
          exit 1

  # ---------------------------------------------------------------------------
  # Release summary — collects the digests + version into a single job
  # summary so ops can copy-paste the payload straight into the deploy
  # ticket. Also stores digests as an artifact for the audit trail.
  # ---------------------------------------------------------------------------
  summary:
    name: Release summary
    needs: [verify-tag, publish, smoke]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    steps:
      - name: Compose summary
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          {
            echo "## Workpulse release v${VERSION}"
            echo
            echo "* API image: \`${{ env.IMAGE_API }}:${VERSION}\`"
            echo "* Web image: \`${{ env.IMAGE_WEB }}:${VERSION}\`"
            echo
            echo "### Next steps"
            echo "1. On the target VPS: \`IMAGE_TAG=${VERSION} bash scripts/deploy.sh\`"
            echo "2. Post-deploy: \`bash scripts/health-check.sh\`"
            echo "3. If red, rollback: \`bash scripts/rollback.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
