name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  # Required by tests / prisma; values are non-secret dummies safe for CI.
  NODE_ENV: test
  APP_TIMEZONE: Asia/Jakarta
  DATABASE_URL: postgresql://workpulse:workpulse@localhost:5432/workpulse?schema=public
  JWT_SECRET: ci_dummy_jwt_secret_do_not_use_in_prod_0123456789abcdef
  JWT_REFRESH_SECRET: ci_dummy_refresh_secret_do_not_use_in_prod_0123456789abcdef
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: lint + typecheck + unit tests + build (no external services)
  # Our current test suite mocks Prisma so it does not need a running Postgres.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @workpulse/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @workpulse/api exec prisma generate

      - name: Prisma schema validate
        run: pnpm --filter @workpulse/api exec prisma validate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Advisory-only audit — fails at MODERATE+ so a maintainer notices,
      # but the CRITICAL gate lives in the Security workflow so nobody
      # merges to main with a critical hole.
      - name: pnpm audit (prod, advisory)
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true

      - name: Build all packages
        run: pnpm build

  # ---------------------------------------------------------------------------
  # End-to-end tests (Playwright). Boots api + web against a real Postgres
  # container, then runs the Chromium suite. Split from `verify` because it
  # needs external services and is slower to start; splitting keeps fast
  # feedback fast.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E · Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: workpulse
          POSTGRES_PASSWORD: workpulse
          POSTGRES_DB: workpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workpulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://workpulse:workpulse@localhost:5432/workpulse?schema=public
      # Web reaches the API through the localhost port both processes bind to.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      # Playwright config uses these to know where to hit /health.
      E2E_API_URL: http://localhost:4000
      E2E_WEB_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @workpulse/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @workpulse/api exec prisma generate

      - name: Build api + web (production)
        # The webServer block in playwright.config uses `start:prod`/`start`
        # under CI, so both artefacts must exist before Playwright launches.
        run: |
          pnpm --filter @workpulse/api build
          pnpm --filter @workpulse/web build

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Run E2E suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload trace + video on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker image smoke build — makes sure our Dockerfiles stay green.
  # Runs in parallel with `verify`; images are NOT pushed.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (api + web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: workpulse/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: false
          tags: workpulse/web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://api:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
